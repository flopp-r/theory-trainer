<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14120f" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3eee2" />
    <meta name="description" content="Practise music notation and theory." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Music Theory Trainer</title>
    <script>
      // Apply a theme chosen in Settings before the page first draws (the app keeps it in sync afterwards).
      try {
        var t = JSON.parse(localStorage.getItem('theory-trainer:settings') || '{}').theme
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
